name: build

# Every change to the apps is built here. The finished apps are locked with the TV key (the LINK_KEY secret)
# and put on the "dist" branch, where the TV and the phone pick them up and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Keys
        env:
          LINK_KEY: ${{ secrets.LINK_KEY }}
        run: |
          test -n "$LINK_KEY" || { echo "The LINK_KEY secret is missing"; exit 1; }
          python3 -m pip install --quiet cryptography
          python3 tools/seal.py open signing/release.p12.bin "$RUNNER_TEMP/release.p12"
          for p in tv phone; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="link_key" translatable="false">%s</string>\n</resources>\n' "$LINK_KEY" > $p/app/src/main/res/values/link.xml
          done

      - name: Build
        run: |
          mkdir -p out
          # Each app's number only goes up when that app changes, so the TV doesn't update for a phone-only change.
          TV=$((100 + $(git rev-list --count HEAD -- tv)))
          PHONE=$((100 + $(git rev-list --count HEAD -- phone)))
          echo "TV=$TV" >> $GITHUB_ENV; echo "PHONE=$PHONE" >> $GITHUB_ENV
          set -o pipefail
          (cd tv && chmod +x gradlew && VERSION_CODE=$TV KEYSTORE="$RUNNER_TEMP/release.p12" ./gradlew --no-daemon -q assembleRelease) 2>&1 | tee out/build.log
          (cd phone && chmod +x gradlew && VERSION_CODE=$PHONE KEYSTORE="$RUNNER_TEMP/release.p12" ./gradlew --no-daemon -q assembleRelease) 2>&1 | tee -a out/build.log

      - name: Lock and publish
        env:
          LINK_KEY: ${{ secrets.LINK_KEY }}
        run: |
          mkdir -p dist
          python3 tools/seal.py seal tv/app/build/outputs/apk/release/app-release.apk dist/tv.bin
          python3 tools/seal.py cbc  tv/app/build/outputs/apk/release/app-release.apk dist/tv.cbc
          python3 tools/seal.py seal phone/app/build/outputs/apk/release/app-release.apk dist/phone.bin
          printf '{"tv": %s, "phone": %s, "commit": "%s"}\n' "$TV" "$PHONE" "$GITHUB_SHA" > dist/version.json
          cp out/build.log dist/build.log
          cd dist
          git init -q -b dist
          git config user.name "Living Room builds"; git config user.email "builds@users.noreply.github.com"
          git add -A; git commit -qm "Build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dist

      - name: Report a failed build
        if: failure()
        run: |
          mkdir -p fail; cp out/build.log fail/ 2>/dev/null || echo "failed before the build started" > fail/build.log
          cd fail
          git init -q -b build-failed
          git config user.name "Living Room builds"; git config user.email "builds@users.noreply.github.com"
          git add -A; git commit -qm "Failed $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-failed
